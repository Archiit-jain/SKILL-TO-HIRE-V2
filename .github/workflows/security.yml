# Security remediation P2 (L-6): every push and pull request runs the type checks, the test suite, a production build and
# a dependency vulnerability audit (fails on high or critical advisories). Uses only GitHub Actions and npm.
name: Security checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Dependency audit (high and critical)
        run: npm run audit
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npx vite build
